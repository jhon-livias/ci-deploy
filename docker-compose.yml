name: ci

x-backend-image: &backend-image
  image: ${BACKEND_IMAGE:-ci-backend}:${BACKEND_TAG:-local}
  restart: unless-stopped
  init: true
  networks: [internal]
  read_only: true
  tmpfs: [/tmp]
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]

x-redis-env: &redis-env
  REDIS_HOST: redis
  REDIS_PASSWORD: ${REDIS_PASSWORD:?set-in-env}

services:
  # Build once; all NestJS services run from this immutable image with SERVICE set below.
  gateway:
    <<: *backend-image
    build:
      context: ../ci-backend
      dockerfile: Dockerfile
    environment:
      <<: *redis-env
      SERVICE: gateway
      NODE_ENV: production
      GATEWAY_PORT: 3000
      AUTH_UPSTREAM: http://auth:3001
    expose: ['3000']
    depends_on:
      redis: { condition: service_healthy }
    healthcheck:
      test: ['CMD-SHELL', "node -e \"fetch('http://127.0.0.1:3000/api/v1/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  auth:
    <<: *backend-image
    depends_on:
      auth-migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    environment:
      <<: *redis-env
      SERVICE: auth
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_DEFAULT_USER:?set-in-env}
      RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS:?set-in-env}
      NOTIFICATION_TRANSPORTS: ${NOTIFICATION_TRANSPORTS:-websocket}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      NODE_ENV: production
      AUTH_PORT: 3001
      AUTH_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=auth
      AUTH_JWT_ACCESS_SECRET: ${AUTH_JWT_ACCESS_SECRET:?set-in-env}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      RECAPTCHA_ENABLED: ${RECAPTCHA_ENABLED:-true}
      RECAPTCHA_SECRET_KEY: ${RECAPTCHA_SECRET_KEY:?set-in-env}
      RECAPTCHA_MIN_SCORE: ${RECAPTCHA_MIN_SCORE:-0.5}
      RECAPTCHA_ALLOWED_HOSTNAMES: ${RECAPTCHA_ALLOWED_HOSTNAMES:?set-in-env}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      SITES_INTERNAL_SECRET: ${SITES_INTERNAL_SECRET:?set-in-env}
      ACADEMIC_UPSTREAM: http://academic:3002
      PAYMENTS_UPSTREAM: http://payments:3007
      ATTENDANCE_GRADES_UPSTREAM: http://attendance-grades:3005
      STUDENTS_UPSTREAM: http://students:3003
      ENROLLMENT_UPSTREAM: http://enrollment:3004
    networks: [internal, egress]
    expose: ['3001']

  auth-migrate:
    image: ${BACKEND_MIGRATOR_IMAGE:-ci-backend-migrator}:${BACKEND_TAG:-local}
    build:
      context: ../ci-backend
      dockerfile: Dockerfile
      target: build
    restart: 'no'
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      AUTH_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=auth
    command: ['npm', 'run', 'auth:db:migrate:deploy']
    networks: [internal]

  # Se ejecuta una sola vez de forma explícita para crear la primera cuenta.
  # Ejemplo: docker compose run --rm -e ADMIN_USERNAME=admin ... auth-admin-bootstrap
  auth-admin-bootstrap:
    image: ${BACKEND_MIGRATOR_IMAGE:-ci-backend-migrator}:${BACKEND_TAG:-local}
    build:
      context: ../ci-backend
      dockerfile: Dockerfile
      target: build
    profiles: ['manual']
    restart: 'no'
    depends_on:
      auth-migrate: { condition: service_completed_successfully }
    environment:
      AUTH_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=auth
    command: ['npm', 'run', 'auth:bootstrap-admin']
    networks: [internal]

  academic:
    <<: *backend-image
    depends_on:
      academic-migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    environment:
      <<: *redis-env
      SERVICE: academic
      NODE_ENV: production
      ACADEMIC_PORT: 3002
      ACADEMIC_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=academic
      SITES_INTERNAL_SECRET: ${SITES_INTERNAL_SECRET:?set-in-env}
    expose: ['3002']

  academic-migrate:
    image: ${BACKEND_MIGRATOR_IMAGE:-ci-backend-migrator}:${BACKEND_TAG:-local}
    build:
      context: ../ci-backend
      dockerfile: Dockerfile
      target: build
    restart: 'no'
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      ACADEMIC_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=academic
    command: ['npm', 'run', 'academic:db:migrate:deploy']
    networks: [internal]

  students:
    <<: *backend-image
    depends_on:
      students-migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    environment:
      <<: *redis-env
      SERVICE: students
      NODE_ENV: production
      STUDENTS_PORT: 3003
      STUDENTS_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=students
      SITES_INTERNAL_SECRET: ${SITES_INTERNAL_SECRET:?set-in-env}
    expose: ['3003']

  students-migrate:
    image: ${BACKEND_MIGRATOR_IMAGE:-ci-backend-migrator}:${BACKEND_TAG:-local}
    build:
      context: ../ci-backend
      dockerfile: Dockerfile
      target: build
    restart: 'no'
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      STUDENTS_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=students
    command: ['npm', 'run', 'students:db:migrate:deploy']
    networks: [internal]

  enrollment:
    <<: *backend-image
    depends_on:
      enrollment-migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    environment:
      <<: *redis-env
      SERVICE: enrollment
      NODE_ENV: production
      ENROLLMENT_PORT: 3004
      ENROLLMENT_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=enrollment
      SITES_INTERNAL_SECRET: ${SITES_INTERNAL_SECRET:?set-in-env}
    expose: ['3004']

  enrollment-migrate:
    image: ${BACKEND_MIGRATOR_IMAGE:-ci-backend-migrator}:${BACKEND_TAG:-local}
    build:
      context: ../ci-backend
      dockerfile: Dockerfile
      target: build
    restart: 'no'
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      ENROLLMENT_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=enrollment
    command: ['npm', 'run', 'enrollment:db:migrate:deploy']
    networks: [internal]

  attendance-grades:
    <<: *backend-image
    depends_on:
      attendance-grades-migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    environment:
      <<: *redis-env
      SERVICE: attendance-grades
      NODE_ENV: production
      ATTENDANCE_GRADES_PORT: 3005
      ATTENDANCE_GRADES_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=attendance
      SITES_INTERNAL_SECRET: ${SITES_INTERNAL_SECRET:?set-in-env}
    expose: ['3005']
    volumes:
      - attendance-attachments:/var/lib/ci-attachments

  attendance-grades-migrate:
    image: ${BACKEND_MIGRATOR_IMAGE:-ci-backend-migrator}:${BACKEND_TAG:-local}
    build:
      context: ../ci-backend
      dockerfile: Dockerfile
      target: build
    restart: 'no'
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      ATTENDANCE_GRADES_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=attendance
    command: ['npm', 'run', 'attendance:db:migrate:deploy']
    networks: [internal]

  exams:
    <<: *backend-image
    depends_on:
      redis: { condition: service_healthy }
    environment:
      <<: *redis-env
      SERVICE: exams
      NODE_ENV: production
      EXAMS_PORT: 3006
    expose: ['3006']

  payments:
    <<: *backend-image
    depends_on:
      payments-migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    environment:
      <<: *redis-env
      SERVICE: payments
      NODE_ENV: production
      PAYMENTS_PORT: 3007
      PAYMENTS_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=payments
      SITES_INTERNAL_SECRET: ${SITES_INTERNAL_SECRET:?set-in-env}
    expose: ['3007']

  payments-migrate:
    image: ${BACKEND_MIGRATOR_IMAGE:-ci-backend-migrator}:${BACKEND_TAG:-local}
    build:
      context: ../ci-backend
      dockerfile: Dockerfile
      target: build
    restart: 'no'
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      PAYMENTS_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=payments
    command: ['npm', 'run', 'payments:db:migrate:deploy']
    networks: [internal]

  frontend:
    image: ${FRONTEND_IMAGE:-ci-frontend}:${FRONTEND_TAG:-local}
    build:
      context: ../ci-frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # La clave de sitio es pública y se inyecta al iniciar Nginx; nunca se incluye el secreto.
      RECAPTCHA_ENABLED: ${RECAPTCHA_ENABLED:-true}
      RECAPTCHA_SITE_KEY: ${RECAPTCHA_SITE_KEY:?set-in-env}
    networks: [internal]
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
      # Nginx genera aquí la configuración con la clave pública de reCAPTCHA.
      - /etc/nginx/conf.d:uid=101,gid=101,mode=755
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    expose: ['8080']

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set-in-env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set-in-env}
      POSTGRES_DB: ${POSTGRES_DB:?set-in-env}
    volumes: [postgres-data:/var/lib/postgresql/data]
    networks: [internal]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set-in-env}
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD:?set-in-env}']
    volumes: [redis-data:/data]
    networks: [internal]
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?set-in-env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?set-in-env}
    volumes: [rabbitmq-data:/var/lib/rabbitmq]
    networks: [internal]
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 20s

  minio:
    # MinIO stopped publishing the former Docker Hub image. Pin the current
    # official AIStor-compatible S3 image from Quay instead of using `latest`.
    image: quay.io/minio/aistor/minio:RELEASE.2026-09-19T17-05-25Z
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set-in-env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set-in-env}
    volumes: [minio-data:/data]
    networks: [internal]

  reverse-proxy:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    restart: unless-stopped
    depends_on:
      gateway: { condition: service_healthy }
      frontend: { condition: service_started }
    ports: ['${HTTP_PORT:-8080}:8080']
    volumes:
      - ./reverse-proxy/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [internal, edge]
    read_only: true
    tmpfs: [/tmp, /var/cache/nginx, /var/run]
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]

networks:
  # Sin acceso externo: aloja backend, frontend y datos.
  internal:
    internal: true
  # Solo reverse-proxy: necesaria para publicar el puerto en el host.
  edge:
  # Solo auth: salida a internet para SMTP. El resto de los servicios permanece aislado.
  egress:

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  minio-data:
  attendance-attachments:
