name: ci

x-backend-image: &backend-image
  image: ${BACKEND_IMAGE:-ci-backend}:${BACKEND_TAG:-local}
  restart: unless-stopped
  init: true
  networks: [internal]
  read_only: true
  tmpfs: [/tmp]
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]

services:
  # Build once; all NestJS services run from this immutable image with SERVICE set below.
  gateway:
    <<: *backend-image
    build:
      context: ../ci-backend
      dockerfile: Dockerfile
    environment:
      SERVICE: gateway
      NODE_ENV: production
      GATEWAY_PORT: 3000
      AUTH_UPSTREAM: http://auth:3001
    expose: ['3000']
    healthcheck:
      test: ['CMD-SHELL', "node -e \"fetch('http://127.0.0.1:3000/api/v1/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  auth:
    <<: *backend-image
    depends_on:
      auth-migrate: { condition: service_completed_successfully }
    environment:
      SERVICE: auth
      NODE_ENV: production
      AUTH_PORT: 3001
      AUTH_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=auth
      AUTH_JWT_ACCESS_SECRET: ${AUTH_JWT_ACCESS_SECRET:?set-in-env}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      SITES_INTERNAL_SECRET: ${SITES_INTERNAL_SECRET:?set-in-env}
      ACADEMIC_UPSTREAM: http://academic:3002
    expose: ['3001']

  auth-migrate:
    image: ${BACKEND_MIGRATOR_IMAGE:-ci-backend-migrator}:${BACKEND_TAG:-local}
    build:
      context: ../ci-backend
      dockerfile: Dockerfile
      target: build
    restart: 'no'
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      AUTH_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=auth
    command: ['npm', 'run', 'auth:db:migrate:deploy']
    networks: [internal]

  # Se ejecuta una sola vez de forma explícita para crear la primera cuenta.
  # Ejemplo: docker compose run --rm -e ADMIN_USERNAME=admin ... auth-admin-bootstrap
  auth-admin-bootstrap:
    image: ${BACKEND_MIGRATOR_IMAGE:-ci-backend-migrator}:${BACKEND_TAG:-local}
    build:
      context: ../ci-backend
      dockerfile: Dockerfile
      target: build
    profiles: ['manual']
    restart: 'no'
    depends_on:
      auth-migrate: { condition: service_completed_successfully }
    environment:
      AUTH_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=auth
    command: ['npm', 'run', 'auth:bootstrap-admin']
    networks: [internal]

  academic:
    <<: *backend-image
    depends_on:
      academic-migrate: { condition: service_completed_successfully }
    environment:
      SERVICE: academic
      NODE_ENV: production
      ACADEMIC_PORT: 3002
      ACADEMIC_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=academic
      SITES_INTERNAL_SECRET: ${SITES_INTERNAL_SECRET:?set-in-env}
    expose: ['3002']

  academic-migrate:
    image: ${BACKEND_MIGRATOR_IMAGE:-ci-backend-migrator}:${BACKEND_TAG:-local}
    build:
      context: ../ci-backend
      dockerfile: Dockerfile
      target: build
    restart: 'no'
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      ACADEMIC_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=academic
    command: ['npm', 'run', 'academic:db:migrate:deploy']
    networks: [internal]

  students:
    <<: *backend-image
    environment: { SERVICE: students, NODE_ENV: production, STUDENTS_PORT: 3003 }
    expose: ['3003']

  enrollment:
    <<: *backend-image
    environment: { SERVICE: enrollment, NODE_ENV: production, ENROLLMENT_PORT: 3004 }
    expose: ['3004']

  attendance-grades:
    <<: *backend-image
    environment: { SERVICE: attendance-grades, NODE_ENV: production, ATTENDANCE_GRADES_PORT: 3005 }
    expose: ['3005']

  exams:
    <<: *backend-image
    environment: { SERVICE: exams, NODE_ENV: production, EXAMS_PORT: 3006 }
    expose: ['3006']

  payments:
    <<: *backend-image
    environment: { SERVICE: payments, NODE_ENV: production, PAYMENTS_PORT: 3007 }
    expose: ['3007']

  frontend:
    image: ${FRONTEND_IMAGE:-ci-frontend}:${FRONTEND_TAG:-local}
    build:
      context: ../ci-frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    networks: [internal]
    read_only: true
    tmpfs: [/tmp, /var/cache/nginx, /var/run]
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    expose: ['8080']

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set-in-env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set-in-env}
      POSTGRES_DB: ${POSTGRES_DB:?set-in-env}
    volumes: [postgres-data:/var/lib/postgresql/data]
    networks: [internal]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD:?set-in-env}']
    volumes: [redis-data:/data]
    networks: [internal]

  rabbitmq:
    image: rabbitmq:4-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?set-in-env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?set-in-env}
    volumes: [rabbitmq-data:/var/lib/rabbitmq]
    networks: [internal]

  minio:
    # MinIO stopped publishing the former Docker Hub image. Pin the current
    # official AIStor-compatible S3 image from Quay instead of using `latest`.
    image: quay.io/minio/aistor/minio:RELEASE.2026-09-19T17-05-25Z
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set-in-env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set-in-env}
    volumes: [minio-data:/data]
    networks: [internal]

  reverse-proxy:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    restart: unless-stopped
    depends_on:
      gateway: { condition: service_healthy }
      frontend: { condition: service_started }
    ports: ['${HTTP_PORT:-8080}:8080']
    volumes:
      - ./reverse-proxy/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [internal, edge]
    read_only: true
    tmpfs: [/tmp, /var/cache/nginx, /var/run]
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]

networks:
  # Sin acceso externo: aloja backend, frontend y datos.
  internal:
    internal: true
  # Solo reverse-proxy: necesaria para publicar el puerto en el host.
  edge:

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  minio-data:
