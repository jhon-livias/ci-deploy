# Perfil edge: HTTPS 80/443 + certbot. Úsalo junto a docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.edge.yml up -d
# Primera vez: PROXY_CONF=default.bootstrap.conf y luego scripts/issue-certificate.sh
services:
  reverse-proxy:
    ports: !override ['80:8080', '443:8443']
    volumes:
      - ./reverse-proxy/${PROXY_CONF:-default.ssl.conf}:/etc/nginx/conf.d/default.conf:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro

  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    entrypoint: ['/bin/sh', '-c', 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done']
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    networks: [edge]

volumes:
  certbot_www:
  certbot_certs:
