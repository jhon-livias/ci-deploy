<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName identidad.uprit.edu.pe

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/identidad.uprit.edu.pe/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/identidad.uprit.edu.pe/privkey.pem
    SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1
    SSLCipherSuite HIGH:!aNULL:!MD5:!3DES
    SSLHonorCipherOrder off

    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:18080/ connectiontimeout=5 timeout=60
    ProxyPassReverse / http://127.0.0.1:18080/
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"

    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "no-referrer"

    ErrorLog ${APACHE_LOG_DIR}/identidad-ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/identidad-ssl-access.log combined
</VirtualHost>
</IfModule>
