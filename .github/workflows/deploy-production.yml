name: CD production

on:
  repository_dispatch:
    types: [deploy-production]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      component:
        description: Component to deploy
        type: choice
        required: true
        default: all
        options: [frontend, backend, all]

permissions:
  contents: read

concurrency:
  group: ci-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Resolve deployment target
        id: target
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            # A repository_dispatch puede llegar desde backend o frontend.
            # Siempre se despliega el conjunto de ramas main para no publicar
            # una versión mezclada de ambos repositorios.
            echo "component=all" >> "$GITHUB_OUTPUT"
            echo "sha=" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "component=${{ inputs.component }}" >> "$GITHUB_OUTPUT"
            echo "sha=" >> "$GITHUB_OUTPUT"
          else
            echo "component=deploy" >> "$GITHUB_OUTPUT"
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy through the VPS
        uses: appleboy/ssh-action@v1.2.0
        env:
          RECAPTCHA_SECRET_KEY: ${{ secrets.RECAPTCHA_SECRET_KEY }}
          RECAPTCHA_SITE_KEY: ${{ secrets.RECAPTCHA_SITE_KEY }}
          RECAPTCHA_ALLOWED_HOSTNAMES: ${{ secrets.RECAPTCHA_ALLOWED_HOSTNAMES }}
          RECAPTCHA_MIN_SCORE: ${{ secrets.RECAPTCHA_MIN_SCORE }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          command_timeout: 25m
          envs: RECAPTCHA_SECRET_KEY,RECAPTCHA_SITE_KEY,RECAPTCHA_ALLOWED_HOSTNAMES,RECAPTCHA_MIN_SCORE
          script: |
            export SOURCE_COMPONENT='${{ steps.target.outputs.component }}'
            export SOURCE_SHA='${{ steps.target.outputs.sha }}'
            cd /opt/ci/ci-deploy
            upsert_env() {
              key="$1"
              value="$2"
              if [ -z "$value" ]; then
                return 0
              fi
              tmp="$(mktemp)"
              if [ -f .env ]; then
                grep -v "^${key}=" .env > "$tmp" || true
              fi
              printf '%s=%s\n' "$key" "$value" >> "$tmp"
              mv "$tmp" .env
              chmod 600 .env
            }
            upsert_env RECAPTCHA_ENABLED true
            upsert_env RECAPTCHA_SECRET_KEY "$RECAPTCHA_SECRET_KEY"
            upsert_env RECAPTCHA_SITE_KEY "$RECAPTCHA_SITE_KEY"
            upsert_env RECAPTCHA_MIN_SCORE "${RECAPTCHA_MIN_SCORE:-0.5}"
            upsert_env RECAPTCHA_ALLOWED_HOSTNAMES "$RECAPTCHA_ALLOWED_HOSTNAMES"
            bash scripts/deploy-production.sh
